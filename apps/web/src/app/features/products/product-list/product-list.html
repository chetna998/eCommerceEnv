<div class="p-5">
  <h2 class="text-lg font-medium mb-3">Products</h2>
  <mat-grid-list cols="4" gutterSize="20px" rowHeight="390px">
    @for (product of products(); track product.id) {
        <mat-grid-tile class="!overflow-visible">
          <div
            class="bg-white rounded-lg shadow-md p-4 hover:shadow-xl transition-shadow duration-300 border border-gray-200"
          >
            <div class="relative">
              <div class="flex items-center justify-center">
                @if (product.image) {
                  <img
                    [src]="product.image"
                    [alt]="product.title"
                    class="w-[160px] h-[160px] object-cover border-4 border-white shadow-lg"
                  />
                }
              </div>

              <div class="bg-white">
                <h3 class="text-lg font-semibold text-gray-800 mb-1 line-clamp-[1]">
                  {{ product.title }}
                </h3>
                <p
                  class="text-xs text-gray-500 font-mono bg-gray-50 px-2 py-1 rounded inline-block"
                >
                  {{ product.id }}
                </p>
              </div>
            </div>

            <div class="pb-4">
              <div class="mb-3 pt-3 border-t border-gray-100">
                <p class="text-sm text-gray-600 leading-relaxed line-clamp-[3]">
                  {{ product.description }}
                </p>
                <p>Ratings:{{ product.rating?.rate }}</p>
              </div>
            </div>
          </div>
        </mat-grid-tile>
    }
  </mat-grid-list>
</div>
