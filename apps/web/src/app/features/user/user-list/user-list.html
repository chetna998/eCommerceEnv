<mat-card class="list">
  
    @for(user of users(); track user.id){
   
      <div class="flex p-1 items-center gap-1">
        <img [src]="user.avatar" alt="" class="h-[100px] w-[100px] rounded" />
        <div class="text-lg">{{ user.first_name }} {{ user.last_name }}</div>
      </div>
    }

</mat-card>
