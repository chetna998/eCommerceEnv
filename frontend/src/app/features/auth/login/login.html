<mat-card class="login-card" appearance="outlined" class="m-6">
  <mat-card-header>
    <mat-card-title>
      <h3 class="mb-3">Login</h3>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form>
      <div>
        <mat-form-field>
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="email" type="email" name="email" />
        </mat-form-field>
      </div>
      <div>
        <mat-form-field>
          <mat-label>Password</mat-label>
          <input matInput [(ngModel)]="password" type="password" name="password" />
        </mat-form-field>
      </div>
    </form>
    <button matButton [disabled]="!email || !password" (click)="handleSubmit()">Login</button>
  </mat-card-content>
</mat-card>
